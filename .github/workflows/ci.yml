name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: "Dogfood: fail if AGENTS.md drifted from the code"
        run: |
          go run ./cmd/repoctx generate .
          git diff --exit-code AGENTS.md
      - run: go run ./cmd/repoctx audit . --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Regenerate the examples cookbook
        run: make docs-examples
      - name: Fail if the cookbook drifted
        run: git diff --exit-code docs/examples.md

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - name: External-corpus benchmark (real repos at pinned SHAs)
        run: bash scripts/corpus.sh --fail
