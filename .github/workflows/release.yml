name: release

'on':
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the release artifacts
        run: make release VERSION="${GITHUB_REF_NAME}"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/repoctx_* dist/SHA256SUMS.txt

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Build the release artifacts
        run: make release VERSION="${GITHUB_REF_NAME}"
      - name: Stage binaries into npm packages
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "NPM_TOKEN not set; skipping npm publish."; exit 0; fi
          bash scripts/npm-stage.sh "${GITHUB_REF_NAME}"
      - name: Publish all packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "NPM_TOKEN not set; skipping npm publish."; exit 0; fi
          for d in npm/repoctx npm/repoctx-*; do
            (cd "$d" && npm publish --access public)
          done
